# Optional local databases for development: `docker compose up -d`.
# Local MySQL 8 / MongoDB installs work too; just point MYSQL_URL and
# MONGO_URL in .env at them. Credentials below are dev-only defaults.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: energy
      MYSQL_USER: energy
      MYSQL_PASSWORD: energy
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
